name: Build MT5 HUD APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project files
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MT5SmartHUD"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.smart.mt5hud'
              compileSdk 34

              defaultConfig {
                  applicationId "com.smart.mt5hud"
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName "4.0-AI-Bot"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <package android:name="net.metaquotes.metatrader5" />
              </queries>

              <application
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MT5AutoService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="120"
              android:description="@string/service_desc"
              android:settingsActivity="com.smart.mt5hud.MainActivity" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MT5 AI Bot &amp; HUD</string>
              <string name="service_desc">روبوت ذكي لتحليل السيولة والتداول الآلي وحماية الحساب فوق MT5</string>
              <string name="max_lot_label">أقصى حجم عقد مسموح (Lot)</string>
              <string name="enable_lock">تفعيل قفل الحجم التلقائي</string>
              <string name="enable_bot">🤖 تفعيل الروبوت الآلي (بيع وشراء تلقائي عند السيولة)</string>
              <string name="enable_draw">🎨 رسم مناطق السيولة (BSL / SSL) فوق الشارت</string>
              <string name="save">حفظ الإعدادات</string>
              <string name="open_access">1. تفعيل الخدمة من إمكانية الوصول</string>
              <string name="saved">تم حفظ الإعدادات بنجاح</string>
              <string name="invalid">أدخل رقماً صحيحاً أكبر من صفر</string>
              <string name="require_sl">تنبيه عند غياب وقف الخسارة (SL)</string>
              <string name="require_tp">تنبيه عند غياب جني الأرباح (TP)</string>
              <string name="enable_daily">تفعيل حد الخسارة اليومي</string>
              <string name="auto_block">منع فتح الصفقات تلقائياً عند بلوغ حد الخسارة</string>
              <string name="daily_pct_label">حد الخسارة اليومي (% من الرصيد)</string>
              <string name="reset_day">إعادة ضبط حساب اليوم</string>
              <string name="reset_done">تمت إعادة ضبط اليوم</string>
              <string name="status_ok">✅ نسخة MT5 الحالية: %1$s (معتمدة)</string>
              <string name="status_paused">⏸ تحدّث MT5 إلى %1$s (المعتمدة: %2$s). الخدمة متوقفة حتى تعتمد النسخة.</string>
              <string name="status_unknown">نسخة MT5 غير معروفة (تأكد من تثبيت MT5)</string>
              <string name="approve">اعتماد نسخة MT5 الحالية</string>
              <string name="approved_done">تم اعتماد النسخة</string>
              <string name="refresh_diag">تحديث التشخيص</string>
              <string name="diag_title">تقرير الفحص الذكي والسيولة:</string>
              <string name="diag_empty">لا يوجد تقرير بعد. افتح MT5 ثم ارجع هنا.</string>
          </resources>
          EOF
          mkdir -p app/src/main/java/com/smart/mt5hud
          cat > app/src/main/java/com/smart/mt5hud/Prefs.kt <<'EOF'
          package com.smart.mt5hud

          import android.content.Context

          class Prefs(ctx: Context) {
              private val sp = ctx.applicationContext.getSharedPreferences("hud", Context.MODE_PRIVATE)

              var enabled: Boolean
                  get() = sp.getBoolean("enabled", true)
                  set(v) { sp.edit().putBoolean("enabled", v).apply() }

              var botEnabled: Boolean
                  get() = sp.getBoolean("botEnabled", false)
                  set(v) { sp.edit().putBoolean("botEnabled", v).apply() }

              var drawLiquidity: Boolean
                  get() = sp.getBoolean("drawLiq", true)
                  set(v) { sp.edit().putBoolean("drawLiq", v).apply() }

              var maxLot: Double
                  get() = sp.getString("maxLot", "0.01")?.toDoubleOrNull() ?: 0.01
                  set(v) { sp.edit().putString("maxLot", v.toString()).apply() }

              var requireSl: Boolean
                  get() = sp.getBoolean("requireSl", true)
                  set(v) { sp.edit().putBoolean("requireSl", v).apply() }

              var requireTp: Boolean
                  get() = sp.getBoolean("requireTp", false)
                  set(v) { sp.edit().putBoolean("requireTp", v).apply() }

              var dailyEnabled: Boolean
                  get() = sp.getBoolean("dailyEnabled", true)
                  set(v) { sp.edit().putBoolean("dailyEnabled", v).apply() }

              var autoBlock: Boolean
                  get() = sp.getBoolean("autoBlock", true)
                  set(v) { sp.edit().putBoolean("autoBlock", v).apply() }

              var dailyLimitPct: Double
                  get() = sp.getString("dailyPct", "3.0")?.toDoubleOrNull() ?: 3.0
                  set(v) { sp.edit().putString("dailyPct", v.toString()).apply() }

              var dayKey: String
                  get() = sp.getString("dayKey", "") ?: ""
                  set(v) { sp.edit().putString("dayKey", v).apply() }

              var dayBaseline: Double
                  get() = sp.getString("dayBase", "0")?.toDoubleOrNull() ?: 0.0
                  set(v) { sp.edit().putString("dayBase", v.toString()).apply() }

              var limitHit: Boolean
                  get() = sp.getBoolean("limitHit", false)
                  set(v) { sp.edit().putBoolean("limitHit", v).apply() }

              var approvedVersion: String
                  get() = sp.getString("approvedVer", "") ?: ""
                  set(v) { sp.edit().putString("approvedVer", v).apply() }

              var diag: String
                  get() = sp.getString("diag", "") ?: ""
                  set(v) { sp.edit().putString("diag", v).apply() }
          }
          EOF
          cat > app/src/main/java/com/smart/mt5hud/Mt5Info.kt <<'EOF'
          package com.smart.mt5hud

          import android.content.Context
          import android.os.Build

          const val MT5_PACKAGE = "net.metaquotes.metatrader5"

          @Suppress("DEPRECATION")
          fun mt5Version(ctx: Context): String? = try {
              val pi = ctx.packageManager.getPackageInfo(MT5_PACKAGE, 0)
              val code = if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode else pi.versionCode.toLong()
              "${pi.versionName}($code)"
          } catch (e: Exception) {
              null
          }
          EOF
          cat > app/src/main/java/com/smart/mt5hud/LiquidityOverlayView.kt <<'EOF'
          package com.smart.mt5hud

          import android.content.Context
          import android.graphics.*
          import android.view.View
          import java.util.Locale

          class LiquidityOverlayView(ctx: Context) : View(ctx) {
              var bslPrice: Double = 0.0
              var sslPrice: Double = 0.0
              var currentPrice: Double = 0.0
              var signalText: String = "🌐 جاري مسح السيولة..."
              var showZones: Boolean = true

              private val bslPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CCFF5252")
                  strokeWidth = 4f
                  style = Paint.Style.STROKE
                  pathEffect = DashPathEffect(floatArrayOf(20f, 12f), 0f)
              }
              private val bslBoxPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#28FF5252")
                  style = Paint.Style.FILL
              }
              private val sslPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CC00E5FF")
                  strokeWidth = 4f
                  style = Paint.Style.STROKE
                  pathEffect = DashPathEffect(floatArrayOf(20f, 12f), 0f)
              }
              private val sslBoxPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#2800E5FF")
                  style = Paint.Style.FILL
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 26f
                  typeface = Typeface.DEFAULT_BOLD
                  setShadowLayer(4f, 0f, 0f, Color.BLACK)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (!showZones || bslPrice <= 0.0 || sslPrice <= 0.0) return

                  val w = width.toFloat()
                  val h = height.toFloat()

                  // تحديد منطقة الرسم فوق الشارت (في منتصف الشاشة بعيداً عن الأزرار العلوية والسفلية)
                  val topY = h * 0.26f
                  val botY = h * 0.68f
                  val chartRight = w * 0.82f

                  // رسم منطقة سيولة القمة (BSL - منطقة بيع محتملة)
                  canvas.drawRect(40f, topY - 28f, chartRight, topY + 10f, bslBoxPaint)
                  canvas.drawLine(40f, topY, chartRight, topY, bslPaint)
                  textPaint.color = Color.parseColor("#FF8A80")
                  canvas.drawText(
                      String.format(Locale.US, "🔻 سيولة القمة (BSL): %.2f", bslPrice),
                      50f, topY - 10f, textPaint
                  )

                  // رسم منطقة سيولة القاع (SSL - منطقة شراء محتملة)
                  canvas.drawRect(40f, botY - 10f, chartRight, botY + 28f, sslBoxPaint)
                  canvas.drawLine(40f, botY, chartRight, botY, sslPaint)
                  textPaint.color = Color.parseColor("#84FFFF")
                  canvas.drawText(
                      String.format(Locale.US, "🔺 سيولة القاع (SSL): %.2f", sslPrice),
                      50f, botY + 34f, textPaint
                  )

                  // رسم مؤشر موقع السعر الحالي بين القمة والقاع
                  if (currentPrice > 0.0 && bslPrice > sslPrice) {
                      val ratio = ((bslPrice - currentPrice) / (bslPrice - sslPrice)).toFloat().coerceIn(0f, 1f)
                      val curY = topY + ratio * (botY - topY)
                      textPaint.color = Color.parseColor("#FFD700")
                      canvas.drawText("◀ $signalText", 50f, curY, textPaint)
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/smart/mt5hud/MainActivity.kt <<'EOF'
          package com.smart.mt5hud

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var prefs: Prefs
              private lateinit var status: TextView
              private lateinit var diagView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = Prefs(this)
                  val pad = (20 * resources.displayMetrics.density).toInt()
                  val decimal = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }
                  val title = TextView(this).apply {
                      text = getString(R.string.app_name); textSize = 22f
                  }
                  status = TextView(this)
                  val open = Button(this).apply {
                      text = getString(R.string.open_access)
                      setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  }
                  val label = TextView(this).apply { text = getString(R.string.max_lot_label) }
                  val input = EditText(this).apply {
                      inputType = decimal
                      setText(prefs.maxLot.toString())
                  }
                  val toggle = Switch(this).apply {
                      text = getString(R.string.enable_lock); isChecked = prefs.enabled
                  }
                  val botSwitch = Switch(this).apply {
                      text = getString(R.string.enable_bot); isChecked = prefs.botEnabled
                  }
                  val drawSwitch = Switch(this).apply {
                      text = getString(R.string.enable_draw); isChecked = prefs.drawLiquidity
                  }
                  val slSwitch = Switch(this).apply {
                      text = getString(R.string.require_sl); isChecked = prefs.requireSl
                  }
                  val tpSwitch = Switch(this).apply {
                      text = getString(R.string.require_tp); isChecked = prefs.requireTp
                  }
                  val dailyLabel = TextView(this).apply { text = getString(R.string.daily_pct_label) }
                  val dailyInput = EditText(this).apply {
                      inputType = decimal
                      setText(prefs.dailyLimitPct.toString())
                  }
                  val dailySwitch = Switch(this).apply {
                      text = getString(R.string.enable_daily); isChecked = prefs.dailyEnabled
                  }
                  val blockSwitch = Switch(this).apply {
                      text = getString(R.string.auto_block); isChecked = prefs.autoBlock
                  }
                  val save = Button(this).apply {
                      text = getString(R.string.save)
                      setOnClickListener {
                          val v = input.text.toString().replace(',', '.').toDoubleOrNull()
                          val d = dailyInput.text.toString().replace(',', '.').toDoubleOrNull()
                          if (v == null || v <= 0.0 || d == null || d <= 0.0 || d > 100.0) {
                              Toast.makeText(context, R.string.invalid, Toast.LENGTH_SHORT).show()
                          } else {
                              prefs.maxLot = v
                              prefs.enabled = toggle.isChecked
                              prefs.botEnabled = botSwitch.isChecked
                              prefs.drawLiquidity = drawSwitch.isChecked
                              prefs.requireSl = slSwitch.isChecked
                              prefs.requireTp = tpSwitch.isChecked
                              prefs.dailyLimitPct = d
                              prefs.dailyEnabled = dailySwitch.isChecked
                              prefs.autoBlock = blockSwitch.isChecked
                              Toast.makeText(context, R.string.saved, Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
                  val reset = Button(this).apply {
                      text = getString(R.string.reset_day)
                      setOnClickListener {
                          prefs.limitHit = false
                          prefs.dayKey = ""
                          Toast.makeText(context, R.string.reset_done, Toast.LENGTH_SHORT).show()
                      }
                  }
                  val approve = Button(this).apply {
                      text = getString(R.string.approve)
                      setOnClickListener {
                          val ver = mt5Version(context)
                          if (ver != null) {
                              prefs.approvedVersion = ver
                              Toast.makeText(context, R.string.approved_done, Toast.LENGTH_SHORT).show()
                              refresh()
                          }
                      }
                  }
                  val diagTitle = TextView(this).apply { text = getString(R.string.diag_title) }
                  diagView = TextView(this).apply { setTextIsSelectable(true) }
                  val refreshBtn = Button(this).apply {
                      text = getString(R.string.refresh_diag)
                      setOnClickListener { refresh() }
                  }
                  listOf(
                      title, status, open, label, input, toggle, botSwitch, drawSwitch,
                      slSwitch, tpSwitch, dailyLabel, dailyInput, dailySwitch, blockSwitch,
                      save, reset, approve, diagTitle, diagView, refreshBtn
                  ).forEach { root.addView(it) }
                  setContentView(ScrollView(this).apply { addView(root) })
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              private fun refresh() {
                  val ver = mt5Version(this)
                  val approved = prefs.approvedVersion
                  status.text = when {
                      ver == null -> getString(R.string.status_unknown)
                      approved.isEmpty() || approved == ver -> getString(R.string.status_ok, ver)
                      else -> getString(R.string.status_paused, ver, approved)
                  }
                  diagView.text = prefs.diag.ifEmpty { getString(R.string.diag_empty) }
              }
          }
          EOF
          cat > app/src/main/java/com/smart/mt5hud/MT5AutoService.kt <<'EOF'
          package com.smart.mt5hud

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread
          import kotlin.math.abs

          class MT5AutoService : AccessibilityService() {

              private enum class Field { VOLUME, SL, TP }

              private val labels = mapOf(
                  Field.VOLUME to listOf("volume", "الحجم", "lots"),
                  Field.SL to listOf("stop loss", "stop-loss", "وقف الخسارة", "وقف خسارة"),
                  Field.TP to listOf("take profit", "take-profit", "جني الأرباح", "جني الربح", "هدف الربح")
              )
              private val sellWords = listOf("sell", "بيع")
              private val buyWords = listOf("buy", "شراء")
              private val balanceWords = listOf("balance", "الرصيد")
              private val equityWords = listOf("equity", "الأسهم", "حقوق الملكية")
              private val numRe = Regex("^[-+]?[0-9][0-9 .,\u00A0\u202F]*\$")
              private val priceExtractRe = Regex("([0-9]{3,5}\\.[0-9]{2})")

              private var hudContainer: LinearLayout? = null
              private var hudText: TextView? = null
              private var botToggleBtn: TextView? = null
              private var overlayView: LiquidityOverlayView? = null

              private var lastRun = 0L
              private var lastDiagAt = 0L
              private var lastAdjust: String? = null
              private var lastAdjustAt = 0L
              private var lastWarnKey = ""
              private var lastBlockAt = 0L
              private var lastTradeAt = 0L
              private var lastNetFetch = 0L

              // متغيرات رادار السيولة والروبوت
              private val priceMemory = mutableListOf<Double>()
              private var netBsl = 0.0
              private var netSsl = 0.0
              private var aiSignal = "⏳ جاري تحليل السيولة..."
              private val mainHandler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  showOverlays()
                  startInternetRadar()
              }

              // جلب بيانات السيولة الحية للذهب عبر الإنترنت كل 12 ثانية
              private fun startInternetRadar() {
                  thread(start = true) {
                      while (true) {
                          try {
                              val now = System.currentTimeMillis()
                              if (now - lastNetFetch > 12000) {
                                  lastNetFetch = now
                                  val url = URL("https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=15m&limit=24")
                                  val conn = url.openConnection() as HttpURLConnection
                                  conn.connectTimeout = 5000
                                  conn.readTimeout = 5000
                                  if (conn.responseCode == 200) {
                                      val body = conn.inputStream.bufferedReader().readText()
                                      val arr = JSONArray(body)
                                      var maxH = 0.0
                                      var minL = Double.MAX_VALUE
                                      for (i in 0 until arr.length()) {
                                          val k = arr.getJSONArray(i)
                                          val h = k.getString(2).toDoubleOrNull() ?: continue
                                          val l = k.getString(3).toDoubleOrNull() ?: continue
                                          if (h > maxH) maxH = h
                                          if (l < minL) minL = l
                                      }
                                      if (maxH > 0.0 && minL < Double.MAX_VALUE) {
                                          netBsl = maxH
                                          netSsl = minL
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                          Thread.sleep(5000)
                      }
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  val pkg = event?.packageName?.toString() ?: return

                  if (pkg != MT5_PACKAGE) {
                      if (pkg != packageName && !pkg.contains("inputmethod") && !pkg.contains("keyboard")) {
                          hudContainer?.visibility = View.GONE
                          overlayView?.visibility = View.GONE
                      }
                      return
                  }
                  val prefs = Prefs(this)
                  hudContainer?.visibility = View.VISIBLE
                  overlayView?.visibility = if (prefs.drawLiquidity) View.VISIBLE else View.GONE

                  val now = System.currentTimeMillis()
                  if (now - lastRun < 220) return
                  lastRun = now

                  val root = rootInActiveWindow ?: return
                  val edits = mutableListOf<AccessibilityNodeInfo>()
                  val texts = mutableListOf<String>()
                  val descs = mutableListOf<String>()
                  var buyBtnNode: AccessibilityNodeInfo? = null
                  var sellBtnNode: AccessibilityNodeInfo? = null
                  var screenBuyPrice: Double? = null
                  var screenSellPrice: Double? = null

                  collectAll(root, edits, texts, descs) { node, combinedText ->
                      val low = combinedText.lowercase()
                      if (low.contains("buy") || low.contains("شراء")) {
                          if (node.isClickable) buyBtnNode = node
                          else if (node.parent?.isClickable == true) buyBtnNode = node.parent
                          priceExtractRe.find(combinedText)?.groupValues?.get(1)?.toDoubleOrNull()?.let {
                              screenBuyPrice = it
                          }
                      }
                      if (low.contains("sell") || low.contains("بيع")) {
                          if (node.isClickable) sellBtnNode = node
                          else if (node.parent?.isClickable == true) sellBtnNode = node.parent
                          priceExtractRe.find(combinedText)?.groupValues?.get(1)?.toDoubleOrNull()?.let {
                              screenSellPrice = it
                          }
                      }
                  }

                  // استخراج السعر الحي من الشاشة وتحديث رادار السيولة
                  val livePrice = screenBuyPrice ?: screenSellPrice ?: extractChartPrice(texts)
                  if (livePrice != null && livePrice > 100.0) {
                      priceMemory.add(livePrice)
                      if (priceMemory.size > 120) priceMemory.removeAt(0)
                  }

                  val localHigh = priceMemory.maxOrNull() ?: 0.0
                  val localLow = priceMemory.minOrNull() ?: 0.0

                  // إذا كان سعر الشاشة قريباً من سعر الإنترنت ندمجهما، وإلا نعتمد سيولة الشاشة المباشرة
                  val activeBsl = if (livePrice != null && netBsl > 0 && abs(livePrice - netBsl) < 60) {
                      maxOf(netBsl, localHigh)
                  } else if (localHigh > 0) {
                      if (localHigh - localLow < 2.0) localHigh + 3.5 else localHigh
                  } else netBsl

                  val activeSsl = if (livePrice != null && netSsl > 0 && abs(livePrice - netSsl) < 60) {
                      minOf(netSsl, if (localLow > 0) localLow else netSsl)
                  } else if (localLow > 0) {
                      if (localHigh - localLow < 2.0) localLow - 3.5 else localLow
                  } else netSsl

                  // تحليل الذكاء الاصطناعي واتخاذ قرار البيع أو الشراء
                  if (livePrice != null && activeBsl > activeSsl && activeSsl > 0) {
                      val range = (activeBsl - activeSsl).coerceAtLeast(1.0)
                      val distToTop = activeBsl - livePrice
                      val distToBot = livePrice - activeSsl

                      when {
                          distToTop <= range * 0.15 -> {
                              aiSignal = "🔴 سحب سيولة قمة (إشارة بيع SELL)"
                              if (prefs.botEnabled && !prefs.limitHit && now - lastTradeAt > 30000) {
                                  sellBtnNode?.let {
                                      lastTradeAt = now
                                      vibrate()
                                      it.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                      lastAdjust = "🤖 الروبوت نفذ صفقة بيع (SELL) عند $livePrice"
                                      lastAdjustAt = now
                                  }
                              }
                          }
                          distToBot <= range * 0.15 -> {
                              aiSignal = "🟢 سحب سيولة قاع (إشارة شراء BUY)"
                              if (prefs.botEnabled && !prefs.limitHit && now - lastTradeAt > 30000) {
                                  buyBtnNode?.let {
                                      lastTradeAt = now
                                      vibrate()
                                      it.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                      lastAdjust = "🤖 الروبوت نفذ صفقة شراء (BUY) عند $livePrice"
                                      lastAdjustAt = now
                                  }
                              }
                          }
                          else -> {
                              aiSignal = "⚖️ السعر ($livePrice) في منطقة توازن"
                          }
                      }
                  }

                  overlayView?.apply {
                      bslPrice = activeBsl
                      sslPrice = activeSsl
                      currentPrice = livePrice ?: 0.0
                      signalText = aiSignal
                      showZones = prefs.drawLiquidity
                      postInvalidate()
                  }

                  val ver = mt5Version(this)
                  if (ver != null && prefs.approvedVersion.isEmpty()) prefs.approvedVersion = ver
                  val paused = ver != null && ver != prefs.approvedVersion

                  val fields = edits.map { it to fieldOf(it) }
                  val bal = numberAfterLabel(texts, balanceWords) ?: numberAfterLabel(descs, balanceWords)
                  val eq = numberAfterLabel(texts, equityWords) ?: numberAfterLabel(descs, equityWords)
                  writeDiag(prefs, ver, now, fields, bal, eq, livePrice, activeBsl, activeSsl)

                  if (paused) {
                      render(prefs, listOf("⏸ MT5 تحدّث ($ver) — اعتمد النسخة من التطبيق"), null, false)
                      return
                  }

                  val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                  var pnlLine: String? = null
                  if (prefs.dailyEnabled) {
                      if (bal != null && prefs.dayKey != today) {
                          prefs.dayKey = today
                          prefs.dayBaseline = bal
                          prefs.limitHit = false
                      }
                      val base = prefs.dayBaseline
                      if (bal != null && eq != null && prefs.dayKey == today && base > 0.0) {
                          val pnl = eq - base
                          val pct = pnl / base * 100.0
                          pnlLine = String.format(Locale.US, "اليوم: %+.2f$ (%+.2f%%)", pnl, pct)
                          if (-pct >= prefs.dailyLimitPct) prefs.limitHit = true
                      }
                  }

                  var hasVolume = false
                  var slMissing = false
                  var tpMissing = false
                  for ((node, field) in fields) {
                      when (field) {
                          Field.VOLUME -> {
                              hasVolume = true
                              if (prefs.enabled) capVolume(node, prefs.maxLot)
                          }
                          Field.SL -> if (isBlankValue(node)) slMissing = true
                          Field.TP -> if (isBlankValue(node)) tpMissing = true
                          null -> {}
                      }
                  }

                  val warnings = mutableListOf<String>()
                  if (prefs.dailyEnabled && prefs.limitHit && prefs.dayKey == today) {
                      warnings += "🛑 بلغت حد الخسارة اليومي — التداول محظور!"
                      if (hasVolume && prefs.autoBlock && now - lastBlockAt > 1500) {
                          lastBlockAt = now
                          vibrate()
                          performGlobalAction(GLOBAL_ACTION_BACK)
                      }
                  }

                  if (hasVolume && prefs.requireSl && slMissing) warnings += "⚠️ وقف الخسارة (SL) فارغ!"
                  if (hasVolume && prefs.requireTp && tpMissing) warnings += "⚠️ جني الأرباح (TP) فارغ!"
                  render(prefs, warnings, pnlLine, hasVolume)
              }

              private fun extractChartPrice(texts: List<String>): Double? {
                  for (t in texts) {
                      val m = priceExtractRe.find(t)
                      if (m != null) {
                          val v = m.groupValues[1].toDoubleOrNull()
                          if (v != null && v > 500.0) return v
                      }
                  }
                  return null
              }

              private fun writeDiag(
                  prefs: Prefs, ver: String?, now: Long,
                  fields: List<Pair<AccessibilityNodeInfo, Field?>>,
                  bal: Double?, eq: Double?, livePrice: Double?, bsl: Double, ssl: Double
              ) {
                  if (now - lastDiagAt < 2000) return
                  lastDiagAt = now
                  val sb = StringBuilder()
                  sb.append("الوقت: ").append(SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())).append('\n')
                  sb.append("MT5: ").append(ver ?: "غير معروف").append('\n')
                  sb.append("السعر المرصود: ").append(livePrice ?: "جاري البحث...").append('\n')
                  sb.append("سيولة القمة (BSL): ").append(String.format(Locale.US, "%.2f", bsl)).append('\n')
                  sb.append("سيولة القاع (SSL): ").append(String.format(Locale.US, "%.2f", ssl)).append('\n')
                  sb.append("قرار الروبوت: ").append(aiSignal).append('\n')
                  sb.append("حقول الإدخال: ").append(fields.size).append('\n')
                  sb.append("الرصيد: ").append(bal ?: "لم يُقرأ")
                      .append(" | الأسهم: ").append(eq ?: "لم تُقرأ").append('\n')
                  prefs.diag = sb.toString()
              }

              private fun parsePure(s: String): Double? {
                  val t = s.trim().trim(':').trim()
                  if (!numRe.matches(t)) return null
                  val n = t.replace("\u00A0", "").replace("\u202F", "").replace(" ", "")
                  val fixed = when {
                      n.contains('.') -> n.replace(",", "")
                      Regex("[-+]?\\d+,\\d{1,2}").matches(n) -> n.replace(',', '.')
                      else -> n.replace(",", "")
                  }
                  return fixed.toDoubleOrNull()
              }

              private fun numberAfterLabel(texts: List<String>, words: List<String>): Double? {
                  for (i in texts.indices) {
                      val l = texts[i].lowercase()
                      val w = words.firstOrNull { l.contains(it) } ?: continue
                      parsePure(l.substringAfter(w))?.let { return it }
                      for (j in i + 1..minOf(i + 2, texts.lastIndex)) {
                          parsePure(texts[j])?.let { return it }
                      }
                  }
                  return null
              }

              private fun capVolume(node: AccessibilityNodeInfo, maxLot: Double) {
                  val value = node.text?.toString()?.replace(',', '.')?.toDoubleOrNull() ?: return
                  if (value <= maxLot) return
                  val newText = String.format(Locale.US, "%.2f", maxLot)
                  val args = Bundle().apply {
                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, newText)
                  }
                  if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      vibrate()
                      lastAdjust = "🔒 تم خفض العقد تلقائياً من $value إلى $newText"
                      lastAdjustAt = System.currentTimeMillis()
                  }
              }

              private fun isBlankValue(node: AccessibilityNodeInfo): Boolean {
                  val t = node.text?.toString()?.trim().orEmpty()
                  if (t.isEmpty()) return true
                  val d = t.replace(',', '.').toDoubleOrNull()
                  if (d != null) return d == 0.0
                  return labelOfString(t) != null
              }

              private fun fieldOf(node: AccessibilityNodeInfo): Field? {
                  val id = node.viewIdResourceName?.lowercase() ?: ""
                  if (id.contains("volume")) return Field.VOLUME
                  labelOf(node)?.let { return it }
                  var p = node.parent
                  var depth = 0
                  while (p != null && depth < 5) {
                      if (countEdits(p) != 1) return null
                      subtreeField(p)?.let { return it }
                      if (hasSellBuy(p)) return Field.VOLUME
                      p = p.parent
                      depth++
                  }
                  return null
              }

              private fun hasSellBuy(n: AccessibilityNodeInfo): Boolean {
                  val seen = mutableListOf<String>()
                  gatherTexts(n, seen)
                  return seen.any { it in sellWords } && seen.any { it in buyWords }
              }

              private fun gatherTexts(n: AccessibilityNodeInfo, out: MutableList<String>) {
                  val t = n.text?.toString()?.trim()?.lowercase()
                  if (!t.isNullOrEmpty()) out.add(t)
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      gatherTexts(c, out)
                  }
              }

              private fun labelOf(n: AccessibilityNodeInfo): Field? {
                  val s = listOfNotNull(
                      n.text, n.contentDescription,
                      if (Build.VERSION.SDK_INT >= 26) n.hintText else null
                  ).joinToString(" ")
                  return labelOfString(s)
              }

              private fun labelOfString(s: String): Field? {
                  val l = s.lowercase()
                  for ((field, words) in labels) if (words.any { l.contains(it) }) return field
                  return null
              }

              private fun subtreeField(n: AccessibilityNodeInfo): Field? {
                  labelOf(n)?.let { return it }
                  for (i in 0 until n.childCount) {
                      val c = n.getChild(i) ?: continue
                      subtreeField(c)?.let { return it }
                  }
                  return null
              }

              private fun countEdits(n: AccessibilityNodeInfo): Int {
                  var c = if (n.className == "android.widget.EditText") 1 else 0
                  for (i in 0 until n.childCount) {
                      val ch = n.getChild(i) ?: continue
                      c += countEdits(ch)
                  }
                  return c
              }

              private fun collectAll(
                  n: AccessibilityNodeInfo,
                  edits: MutableList<AccessibilityNodeInfo>,
                  texts: MutableList<String>,
                  descs: MutableList<String>,
                  onNode: (AccessibilityNodeInfo, String) -> Unit
              ) {
                  if (n.className == "android.widget.EditText") edits.add(n)
                  val t = n.text?.toString()
                  val d = n.contentDescription?.toString()
                  if (!t.isNullOrBlank()) texts.add(t)
                  if (!d.isNullOrBlank()) descs.add(d)
                  val combined = listOfNotNull(t, d).joinToString(" ")
                  if (combined.isNotBlank()) onNode(n, combined)
                  for (i in 0 until n.childCount) {
                      val ch = n.getChild(i) ?: continue
                      collectAll(ch, edits, texts, descs, onNode)
                  }
              }

              private fun render(prefs: Prefs, warnings: List<String>, pnl: String?, volSeen: Boolean) {
                  val tv = hudText ?: return
                  val btn = botToggleBtn ?: return

                  btn.text = if (prefs.botEnabled) "🤖 الروبوت: يعمل (ON) - اضغط للإيقاف" else "🤖 الروبوت: مراقب فقط (OFF) - اضغط للتشغيل"
                  btn.setBackgroundColor(if (prefs.botEnabled) Color.parseColor("#FF1B5E20") else Color.parseColor("#FF37474F"))

                  val key = warnings.joinToString("|")
                  if (key.isNotEmpty() && key != lastWarnKey) vibrate()
                  lastWarnKey = key
                  if (warnings.isNotEmpty()) {
                      tv.setBackgroundColor(Color.parseColor("#E6B71C1C"))
                      tv.text = (warnings + listOfNotNull(aiSignal, pnl)).joinToString("\n")
                      return
                  }
                  tv.setBackgroundColor(Color.parseColor("#E60B3D2E"))
                  val adj = lastAdjust
                  val seen = if (volSeen) " | ✓ اللوت: ${prefs.maxLot}" else ""
                  val main = when {
                      adj != null && System.currentTimeMillis() - lastAdjustAt < 6000 -> adj
                      prefs.enabled -> "🛡️ الحماية فعالة$seen\n$aiSignal"
                      else -> "🔓 قفل الحجم متوقف\n$aiSignal"
                  }
                  tv.text = listOfNotNull(main, pnl).joinToString("\n")
              }

              @Suppress("DEPRECATION")
              private fun vibrate() {
                  val v = getSystemService(VIBRATOR_SERVICE) as? Vibrator ?: return
                  if (Build.VERSION.SDK_INT >= 26) {
                      v.vibrate(VibrationEffect.createOneShot(250, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      v.vibrate(250)
                  }
              }

              private fun showOverlays() {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  // 1. طبقة رسم خطوط ومناطق السيولة الشفافة فوق الشارت (لا تمنع اللمس)
                  val overlayLp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  val ov = LiquidityOverlayView(this).apply { visibility = View.GONE }
                  wm.addView(ov, overlayLp)
                  overlayView = ov

                  // 2. لوحة التحكم العائمة القابلة للسحب والتحريك بإصبعك
                  val hudLp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.LEFT
                      x = 40
                      y = 220
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      visibility = View.GONE
                  }

                  val tv = TextView(this).apply {
                      setTextColor(Color.parseColor("#FFD700"))
                      setBackgroundColor(Color.parseColor("#E60B3D2E"))
                      setPadding(28, 16, 28, 16)
                      textSize = 11.5f
                  }

                  val btn = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#FF37474F"))
                      setPadding(28, 12, 28, 12)
                      textSize = 11f
                  }

                  // برمجة السحب السلس + الضغط على زر تشغيل/إيقاف الروبوت
                  var initialX = 0
                  var initialY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false

                  val dragListener = View.OnTouchListener { view, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = hudLp.x
                              initialY = hudLp.y
                              touchX = event.rawX
                              touchY = event.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - touchX).toInt()
                              val dy = (event.rawY - touchY).toInt()
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              hudLp.x = initialX + dx
                              hudLp.y = initialY + dy
                              wm.updateViewLayout(container, hudLp)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved && view == btn) {
                                  val p = Prefs(this@MT5AutoService)
                                  p.botEnabled = !p.botEnabled
                                  vibrate()
                                  render(p, emptyList(), null, false)
                              }
                              true
                          }
                          else -> false
                      }
                  }

                  tv.setOnTouchListener(dragListener)
                  btn.setOnTouchListener(dragListener)

                  container.addView(tv)
                  container.addView(btn)
                  wm.addView(container, hudLp)

                  hudContainer = container
                  hudText = tv
                  botToggleBtn = btn
                  render(Prefs(this), emptyList(), null, false)
              }

              override fun onDestroy() {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  hudContainer?.let { wm.removeView(it) }
                  overlayView?.let { wm.removeView(it) }
                  hudContainer = null
                  overlayView = null
                  super.onDestroy()
              }

              override fun onInterrupt() {}
          }
