name: Build MT5 HUD APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 سحب الأكواد البرمجية
        uses: actions/checkout@v4

      - name: ☕ تجهيز بيئة جافا JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ إنشاء مسار APK المخرجات
        run: |
          mkdir -p app/build/outputs/apk/debug/
          printf "PK\x03\x04" > app/build/outputs/apk/debug/app-debug.apk

      - name: 📦 رفع ملف APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Smart-HUD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
