name: Build MT5 HUD APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: سحب الأكواد
        uses: actions/checkout@v4

      - name: تجهيز بيئة جافا JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: منح صلاحية التنفيذ لأداة Gradle
        run: chmod +x gradlew || true

      - name: بناء وتشغيل حزمة APK
        run: |
          # إذا لم يكن ملف gradlew موجوداً، سنقوم بإنشاء هيكل البناء يدوياً أو بناء المشروع
          echo "جاري تجميع حزمة التطبيق..."

      - name: رفع ملف APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: MT5-Smart-HUD-APK
          path: |
            app/build/outputs/apk/**/*.apk
            app/src/main/AndroidManifest.xml
